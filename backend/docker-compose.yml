services:
  db:
    image: postgres:16-alpine
    container_name: tribed_postgres
    restart: always
    environment:
      POSTGRES_USER: tribed_user
      POSTGRES_PASSWORD: tribed_password_secure
      POSTGRES_DB: tribed_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribed_user -d tribed_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: tribed_fastapi
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tribed_user:tribed_password_secure@db:5432/tribed_db
      SECRET_KEY: tribed_production_super_secret_sih_2026
      ENVIRONMENT: development
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
